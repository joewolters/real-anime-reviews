<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Season Reviews — Real Anime Reviews</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script>window.APP_VERSION="2.2.4"</script>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Admin-only season-review editor — not indexed." />

  <link rel="stylesheet" href="../style.css?v=2.2.4" />
  <link rel="stylesheet" href="../mobile.css?v=2.2.4" media="(max-width: 900px)" />
  <link rel="stylesheet" href="suggestions.css?v=2.2.4" />
  <link rel="stylesheet" href="season-reviews.css?v=2.2.4" />
  <link rel="stylesheet" href="section-editor.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="admin-page">

  <header>
    <div class="header-inner">
      <div class="header-left">
        <h1><a href="../index.html" id="home-button" class="logo-link">Real Anime Reviews</a></h1>
        <div class="toolbar">
          <button type="button" id="back-btn" class="inline-header-btn" onclick="location.href='../index.html'">← Back to site</button>
        </div>
      </div>
    </div>
  </header>

  <div id="admin-gate" class="admin-gate">
    <div class="admin-gate-message">
      <div class="admin-gate-spinner"></div>
      <p>Verifying admin access…</p>
    </div>
  </div>

  <main class="admin-main" id="admin-main" hidden>
    <div class="admin-shell">

      <div class="admin-header">
        <h2 class="admin-title-line">
          <span class="admin-kicker-inline">SEASON REVIEWS <span class="jp-mini">感想</span></span>
          <span class="admin-divider">·</span>
          <span class="admin-title-text">Editor</span>
        </h2>
        <div class="sr-stats" id="sr-stats"></div>
      </div>

      <div id="sr-server-banner" class="sr-server-banner" hidden>
        ⚠️ Mode 1 isn't running — browsing the list works here, but opening, editing, saving, or deleting a season review needs Mode 1 on the desktop. Double-click <code>MODE 1</code>, then reload this page.
      </div>

      <div class="sr-toolbar">
        <!-- gate 31 — the native <select> is gone (Blake's no-native-selects rule);
             season-reviews.js mounts a RarBrandSelect (brand-select.js) in the host. -->
        <span class="sr-filter-label" id="sr-filter-label">Show
          <span id="sr-filter-host"></span>
        </span>
      </div>

      <div id="sr-list" class="sr-list"></div>

    </div>
  </main>

  <!-- Markdown editor (branded modal; lives outside .admin-shell to avoid the
       backdrop-filter clip, same as suggestions.html's confirm modal). -->
  <div id="sr-editor" class="sr-editor-overlay" hidden>
    <div class="sr-editor-card" role="dialog" aria-modal="true" aria-label="Season review editor">
      <div class="sr-editor-head">
        <h3 class="sr-editor-kicker">SEASON REVIEW <span class="sr-editor-id" id="sr-editor-id"></span></h3>
        <button type="button" class="sr-editor-close" id="sr-editor-cancel" aria-label="Close editor">×</button>
      </div>
      <div class="sr-editor-fields">
        <label class="sr-field">Title <input type="text" id="sr-editor-title" placeholder="e.g. Demon Slayer — Mugen Train Arc"></label>
        <label class="sr-field sr-field--rating">Rating <input type="text" id="sr-editor-rating" placeholder="8.5"></label>
      </div>
      <div class="sr-editor-grid">
        <div class="sr-editor-pane">
          <div class="sr-editor-pane-label">SECTIONS</div>
          <div id="sr-editor-mount"></div>
        </div>
        <div class="sr-editor-pane">
          <div class="sr-editor-pane-label">PREVIEW</div>
          <div id="sr-editor-preview" class="sr-editor-preview secondary-review-body"></div>
        </div>
      </div>
      <div class="sr-editor-actions">
        <button type="button" class="sr-btn sr-btn--danger" id="sr-editor-delete" hidden>Delete</button>
        <span class="sr-editor-status" id="sr-editor-status"></span>
        <span class="sr-editor-spacer"></span>
        <button type="button" class="sr-btn sr-btn--ghost" id="sr-editor-cancel-2" onclick="document.getElementById('sr-editor').hidden=true">Cancel</button>
        <button type="button" class="sr-btn sr-btn--save" id="sr-editor-save">Save review</button>
      </div>
    </div>
  </div>

  <!-- Catalog + AniList fetch helper + shared markdown renderer, bridged to window. -->
  <script src="../animeData.js"></script>
  <script src="../franchise-fetch.js"></script>
  <script src="../markdown.js"></script>
  <script>window.animeData = (typeof animeData !== 'undefined') ? animeData : (window.animeData || []);</script>
  <script src="brand-select.js"></script>
  <script src="section-editor.js"></script>
  <script src="modal-scroll-lock.js"></script>

  <script type="module" src="../firebase.js?v=2.2.4"></script>
  <script type="module" src="season-reviews.js?v=2.2.4"></script>
</body>
</html>
