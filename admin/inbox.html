<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbox 受信箱 — Real Anime Reviews</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script>window.APP_VERSION="1.9.1"</script>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Admin-only DM inbox — not indexed." />

  <link rel="stylesheet" href="../style.css?v=1.10.1" />
  <link rel="stylesheet" href="../mobile.css?v=1.10.1" media="(max-width: 900px)" />
  <link rel="stylesheet" href="inbox.css?v=1.10.1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="admin-page">

  <header>
    <div class="header-inner">
      <div class="header-left">
        <h1><a href="../index.html" id="home-button" class="logo-link">Real Anime Reviews</a></h1>
        <div class="toolbar">
          <button type="button" id="back-btn" class="inline-header-btn" onclick="location.href='../index.html'">← Back to site</button>
        </div>
      </div>
    </div>
  </header>

  <div id="admin-gate" class="admin-gate">
    <div class="admin-gate-message">
      <div class="admin-gate-spinner"></div>
      <p>Verifying admin access…</p>
    </div>
  </div>

  <main class="admin-main" id="admin-main" hidden>
    <div class="admin-shell">

      <div class="admin-header">
        <h2 class="admin-title-line">
          <span class="admin-kicker-inline">INBOX <span class="jp-mini">受信箱</span></span>
          <span class="admin-divider">·</span>
          <span class="admin-title-text">Letters</span>
        </h2>
        <div class="inbox-stats" id="inbox-stats" hidden></div>
      </div>

      <div id="inbox-app" class="inbox-app">

        <!-- Conversation LIST pane -->
        <section class="conv-pane" aria-label="Conversations">
          <ul id="conv-list" class="conv-list"></ul>
          <div id="conv-empty" class="conv-empty-card" hidden>
            <div class="empty-glyph" aria-hidden="true">📮</div>
            <div class="empty-kicker">NO LETTERS <span class="jp-mini">空</span></div>
            <p class="empty-body">No conversations yet. Member DMs land here.</p>
          </div>
        </section>

        <!-- THREAD pane -->
        <section class="thread-pane" aria-label="Open conversation">
          <div id="thread-placeholder" class="thread-placeholder">
            <div class="empty-glyph" aria-hidden="true">✉️</div>
            <p>Pick a conversation to read it.</p>
          </div>
          <div id="thread-open" class="thread-open" hidden>
            <div class="thread-head">
              <span class="thread-who">
                <span id="thread-who-name" class="thread-who-name"></span>
                <span id="thread-who-uid" class="thread-who-uid"></span>
              </span>
              <button type="button" id="lock-toggle" class="lock-toggle">🔒 Lock</button>
            </div>
            <div id="thread-messages" class="thread-messages" aria-live="polite"></div>
            <div class="thread-composer">
              <textarea id="reply-input" maxlength="2000" rows="3" placeholder="Reply as Blake…" aria-label="Reply"></textarea>
              <button type="button" id="reply-send" class="reply-send" disabled>Send</button>
            </div>
          </div>
        </section>

      </div>

      <div id="inbox-error" class="inbox-error-card" hidden>
        <div class="error-glyph" aria-hidden="true">⚠️</div>
        <div class="error-kicker">COULDN'T LOAD <span class="jp-mini">接続</span></div>
        <p class="error-body">Couldn't reach the inbox. Reload to retry.</p>
        <button type="button" class="error-reload-btn" onclick="location.reload()">Reload</button>
      </div>

    </div>
  </main>

  <script type="module" src="../firebase.js?v=1.10.1"></script>
  <script type="module" src="inbox.js?v=1.10.1"></script>
</body>
</html>
